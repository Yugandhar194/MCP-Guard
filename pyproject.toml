[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-guard"
version = "0.1.0"
description = "A desktop human-approval gateway for MCP tool calls"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "mcp>=1.9.0,<2.0.0",
  "PySide6>=6.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
mcp-guard = "mcp_guard.__main__:main"

[tool.setuptools.packages.find]
include = ["mcp_guard*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
